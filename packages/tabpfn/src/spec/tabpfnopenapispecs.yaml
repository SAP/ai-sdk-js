openapi: 3.1.0
info:
  title: TabPFN inference container (sap)
  description:
    'Single-call fit-and-predict API of the `sap` container distribution. A request carries
    the training table, the target and the test table; the container fits on the first two and predicts
    on the third. No state is kept between requests and there is no authentication layer in the container.


    Baked models: v3, v3.5. Default when `model_version` is omitted: v3.5. Listens on port 8080.'
  version: 9a8f2c44
  x-disabled-tabpfn-config-fields:
    - model_path
    - device
    - ignore_pretraining_limits
paths:
  /health:
    get:
      summary: Liveness
      operationId: health
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthcheckResponse'
              example:
                is_alive: true
                inference_optimizations:
                  - fp8_attention
      description:
        Answers 200 once the models are loaded, and for as long as the process is alive, including
        while a prediction runs.
      tags:
        - operations
  /ready:
    get:
      summary: Readiness
      description:
        Whether the replica has spare capacity. 503 while the number of requests in flight
        has reached `PRIOR_PREDICT_MAX_CONCURRENT_REQUESTS`; always 200 when that limit is unset.
      operationId: ready
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                is_ready: true
                in_flight: 0
                limit: null
        '503':
          description: At the concurrency limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                is_ready: false
                in_flight: 2
                limit: 2
      tags:
        - operations
  /predict:
    post:
      summary: Fit on the training data and predict the test rows
      operationId: predict
      responses:
        '200':
          description: The prediction, the run's metadata and the request's size. The example is illustrative.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictResponse'
              example:
                prediction:
                  - - 0.93
                    - 0.07
                metadata:
                  test_set_num_rows: 1
                  test_set_num_cols: 2
                  n_estimators: 8
                  task: classification
                  package_version: <tabpfn version>
                  tabpfn_config:
                    n_estimators: null
                    categorical_features_indices: null
                    softmax_temperature: null
                    average_before_softmax: null
                    random_state: null
                    inference_config: null
                    inference_precision: null
                    ignore_pretraining_limits: true
                    n_preprocessing_jobs: 4
                    fit_mode: fit_preprocessors
                    device:
                      - cuda:0
                    memory_saving_mode: false
                    model_path: <resolved checkpoint path>
                    balance_probabilities: null
                  classes:
                    - negative
                    - positive
                  top_k: null
                usage:
                  X_train:
                    num_rows: 4
                    num_cols: 2
                    num_cells: 8
                  y_train:
                    num_rows: 4
                    num_cols: 1
                    num_cells: 4
                  X_test:
                    num_rows: 1
                    num_cols: 2
                    num_cells: 2
                  n_estimators: 8
                  num_cells: 14
                  num_predictions: 1
                model_id: null
          headers:
            Sentry-Trace:
              description:
                '`<trace_id>-<span_id>`. The trace id is taken from a request `Sentry-Trace`
                or `X-Cloud-Trace-Context` header when one is sent, else generated.'
              schema:
                type: string
        '400':
          description:
            'Malformed body: invalid JSON, a missing `X_test` / `request` / file part, an invalid
            `task_config` (unknown field, out-of-range value, `top_k` rule), a `model_version` this image
            does not serve, or a cache feature this image does not have.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "model_version='v2' is not baked into this image; available: ['v3', 'v3.5']."
                error_code: USER_ERROR
                trace_id: 3373ccbe99ff4152ab546cbc1739c96f
        '415':
          description:
            '`Content-Type` is missing or neither `application/json` nor `multipart/form-data`,
            or an uploaded file is neither CSV nor Parquet.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "Unsupported media type: 'text/plain'."
                error_code: USER_ERROR
                trace_id: 3373ccbe99ff4152ab546cbc1739c96f
        '422':
          description:
            'The body parsed but cannot be served: missing training data, an unknown top-level
            key, a disabled `tabpfn_config` field, a mis-shaped table, a violated size limit, or data
            the model rejects.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: 'Config overrides not allowed for: device'
                error_code: USER_ERROR
                trace_id: 3373ccbe99ff4152ab546cbc1739c96f
        '500':
          description: Unexpected failure. The message is generic; quote the `trace_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Something went wrong, please report the error with the provided trace id
                error_code: INTERNAL_ERROR
                trace_id: 3373ccbe99ff4152ab546cbc1739c96f
        '503':
          description:
            'The replica is at its concurrency limit (`error_code: BUSY`, only when `PRIOR_PREDICT_MAX_CONCURRENT_REQUESTS`
            is set), or the request waited more than 120 s for the GPU. Safe to retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message:
                  This replica is at its concurrency limit. Retry against another replica, or raise
                  PRIOR_PREDICT_MAX_CONCURRENT_REQUESTS.
                error_code: BUSY
                trace_id: 3373ccbe99ff4152ab546cbc1739c96f
      description:
        'Synchronous: the response is returned when the prediction is done. A replica holds
        one GPU and serves requests one at a time; further requests queue (up to 120 s for the GPU, then
        503).


        Limits, per model:


        - **v3**: ≤ 1,000,000 training rows, ≤ 2,000 columns, ≤ 200,000,000 training cells, ≤ 200,000,000
        training cells per estimator, ≤ 200,000,000 test cells, test rows ≤ min(1,000,000, 250,000,000,000
        ÷ training rows).

        - **v3.5**: ≤ 1,000,000 training rows, ≤ 2,000 columns, ≤ 200,000,000 training cells, ≤ 200,000,000
        training cells per estimator, ≤ 200,000,000 test cells, test rows ≤ min(1,000,000, 250,000,000,000
        ÷ training rows).


        All models: each table ≤ 5 GiB in memory; a response of at most 32,000,000 values (test rows ×
        values per row); `full` regression ≤ 400 test rows. A violated limit is a 422.


        Request bodies must not be compressed (`Content-Encoding: gzip` is not decoded). Responses are
        gzip-compressed when the request sends `Accept-Encoding: gzip`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictRequest'
            examples:
              classification:
                summary: Class probabilities
                value:
                  task_config:
                    task: classification
                    tabpfn_config: {}
                    predict_params:
                      output_type: probas
                  X_train: &id001
                    - - 0.1
                      - 0.2
                    - - 0.8
                      - 0.9
                    - - 0.2
                      - 0.1
                    - - 0.9
                      - 0.7
                  y_train: &id002
                    - negative
                    - positive
                    - negative
                    - positive
                  X_test: &id003
                    - - 0.15
                      - 0.25
              top_k:
                summary: Top-2 classes per row
                value:
                  task_config:
                    task: classification
                    predict_params:
                      output_type: top_k
                      top_k: 2
                  X_train: *id001
                  y_train: *id002
                  X_test: *id003
              regression:
                summary: Quantile regression with named columns
                value:
                  task_config:
                    task: regression
                    tabpfn_config:
                      n_estimators: 4
                    predict_params:
                      output_type: quantiles
                      quantiles:
                        - 0.1
                        - 0.5
                        - 0.9
                  model_version: v3
                  X_train:
                    sqm:
                      - 50
                      - 80
                      - 120
                      - 65
                    city:
                      - Berlin
                      - Munich
                      - Berlin
                      - Hamburg
                  y_train:
                    - 250000
                    - 610000
                    - 590000
                    - 380000
                  X_test:
                    sqm:
                      - 70
                    city:
                      - Munich
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PredictMultipart'
            encoding:
              x_train:
                contentType: text/csv, application/vnd.apache.parquet
              y_train:
                contentType: text/csv, application/vnd.apache.parquet
              x_test:
                contentType: text/csv, application/vnd.apache.parquet
      tags:
        - inference
  /metrics:
    get:
      summary: Prometheus metrics
      operationId: metrics
      description:
        Text exposition format. Request counts and durations per endpoint, stage durations,
        in-flight and readiness gauges, admission rejections, text-column statistics.
      responses:
        '200':
          description: Metrics.
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
      tags:
        - operations
components:
  schemas:
    ClassifierMetadata:
      properties:
        test_set_num_rows:
          type: integer
          title: Test Set Num Rows
          description: Test rows the model saw.
        test_set_num_cols:
          type: integer
          title: Test Set Num Cols
          description:
            Test columns the model saw, after encoding; differs from the request's width when
            columns are dropped or text columns expand.
        n_estimators:
          anyOf:
            - type: integer
            - type: 'null'
          title: N Estimators
          description: Ensemble size the run used.
        task:
          type: string
          const: classification
          title: Task
          default: classification
        package_version:
          type: string
          title: Package Version
          description: Version of the TabPFN package that served the request.
        tabpfn_config:
          $ref: '#/components/schemas/ClassifierTabPFNConfig'
          description:
            The configuration the run used. Settings the request left to the model are null;
            `device` and `model_path` carry what the container resolved.
        classes:
          anyOf:
            - items:
                anyOf:
                  - type: string
                  - type: integer
                  - type: number
                  - type: boolean
              type: array
            - type: 'null'
          title: Classes
          description:
            Class labels in ascending order, original type. The column axis of `probas`. Null
            for `top_k`, where the list travels in `prediction.classes` instead.
        top_k:
          anyOf:
            - type: integer
            - type: 'null'
          title: Top K
          description: The request's `top_k`, else null.
      additionalProperties: false
      type: object
      required:
        - test_set_num_rows
        - test_set_num_cols
        - package_version
        - tabpfn_config
      title: ClassifierMetadata
    ClassifierTabPFNConfig:
      properties:
        n_estimators:
          anyOf:
            - type: integer
              maximum: 8.0
              minimum: 1.0
            - type: 'null'
          title: N Estimators
        categorical_features_indices:
          anyOf:
            - items:
                type: integer
              type: array
            - type: 'null'
          title: Categorical Features Indices
        softmax_temperature:
          anyOf:
            - type: number
            - type: 'null'
          title: Softmax Temperature
        average_before_softmax:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Average Before Softmax
        random_state:
          anyOf:
            - type: integer
            - type: 'null'
          title: Random State
        inference_config:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Inference Config
          description: Refer to tabpfn.inference_config.InferenceConfig for more details.
        inference_precision:
          anyOf:
            - type: string
              enum:
                - autocast
                - auto
            - type: 'null'
          title: Inference Precision
        ignore_pretraining_limits:
          type: boolean
          title: Ignore Pretraining Limits
          default: true
        n_preprocessing_jobs:
          type: integer
          title: N Preprocessing Jobs
          default: 4
        fit_mode:
          $ref: '#/components/schemas/FitMode'
          default: fit_preprocessors
        device:
          anyOf:
            - items:
                type: string
              type: array
              minItems: 1
            - type: 'null'
          title: Device
          description: Stringified `torch.device`s
        memory_saving_mode:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Memory Saving Mode
        model_path:
          anyOf:
            - type: string
            - type: 'null'
          title: Model Path
        balance_probabilities:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Balance Probabilities
      additionalProperties: false
      type: object
      title: ClassifierTabPFNConfig
    FitMode:
      enum:
        - low_memory
        - fit_preprocessors
        - fit_with_cache
        - batched
      title: FitMode
      type: string
    HealthcheckResponse:
      properties:
        is_alive:
          type: boolean
          title: Is Alive
        inference_optimizations:
          items:
            type: string
          type: array
          title: Inference Optimizations
          description:
            Inference optimizations verified to be running in this process at startup. Empty
            on hardware that does not support them.
      additionalProperties: false
      type: object
      required:
        - is_alive
      title: HealthcheckResponse
    InputUsage:
      properties:
        X_train:
          $ref: '#/components/schemas/TableUsage'
        y_train:
          $ref: '#/components/schemas/TableUsage'
        X_test:
          $ref: '#/components/schemas/TableUsage'
        n_estimators:
          type: integer
          title: N Estimators
        num_cells:
          type: integer
          title: Num Cells
          readOnly: true
        num_predictions:
          type: integer
          title: Num Predictions
          description:
            'One per test row, independent of how many values `output_type`

            returns for each.'
          readOnly: true
      additionalProperties: false
      type: object
      required:
        - X_train
        - y_train
        - X_test
        - n_estimators
        - num_cells
        - num_predictions
      title: InputUsage
      description: Size of the request, reproducible from the posted body. Meter on this.
    PredictResponse:
      properties:
        prediction:
          $ref: '#/components/schemas/Prediction'
        metadata:
          oneOf:
            - $ref: '#/components/schemas/ClassifierMetadata'
            - $ref: '#/components/schemas/RegressorMetadata'
          title: Metadata
          discriminator:
            propertyName: task
            mapping:
              classification: '#/components/schemas/ClassifierMetadata'
              regression: '#/components/schemas/RegressorMetadata'
        usage:
          $ref: '#/components/schemas/InputUsage'
        model_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Model Id
          description: Always null in this container.
      additionalProperties: false
      type: object
      required:
        - prediction
        - metadata
        - usage
      title: PredictResponse
    ReadinessResponse:
      properties:
        is_ready:
          type: boolean
          title: Is Ready
        in_flight:
          type: integer
          title: In Flight
          description: Predict requests admitted and not yet finished.
        limit:
          anyOf:
            - type: integer
            - type: 'null'
          title: Limit
          description: The configured concurrency limit; null when unset.
      additionalProperties: false
      type: object
      required:
        - is_ready
        - in_flight
      title: ReadinessResponse
    RegressorMetadata:
      properties:
        test_set_num_rows:
          type: integer
          title: Test Set Num Rows
          description: Test rows the model saw.
        test_set_num_cols:
          type: integer
          title: Test Set Num Cols
          description:
            Test columns the model saw, after encoding; differs from the request's width when
            columns are dropped or text columns expand.
        n_estimators:
          anyOf:
            - type: integer
            - type: 'null'
          title: N Estimators
          description: Ensemble size the run used.
        task:
          type: string
          const: regression
          title: Task
          default: regression
        package_version:
          type: string
          title: Package Version
          description: Version of the TabPFN package that served the request.
        tabpfn_config:
          $ref: '#/components/schemas/RegressorTabPFNConfig'
          description:
            The configuration the run used. Settings the request left to the model are null;
            `device` and `model_path` carry what the container resolved.
      additionalProperties: false
      type: object
      required:
        - test_set_num_rows
        - test_set_num_cols
        - package_version
        - tabpfn_config
      title: RegressorMetadata
    RegressorTabPFNConfig:
      properties:
        n_estimators:
          anyOf:
            - type: integer
              maximum: 8.0
              minimum: 1.0
            - type: 'null'
          title: N Estimators
        categorical_features_indices:
          anyOf:
            - items:
                type: integer
              type: array
            - type: 'null'
          title: Categorical Features Indices
        softmax_temperature:
          anyOf:
            - type: number
            - type: 'null'
          title: Softmax Temperature
        average_before_softmax:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Average Before Softmax
        random_state:
          anyOf:
            - type: integer
            - type: 'null'
          title: Random State
        inference_config:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Inference Config
          description: Refer to tabpfn.inference_config.InferenceConfig for more details.
        inference_precision:
          anyOf:
            - type: string
              enum:
                - autocast
                - auto
            - type: 'null'
          title: Inference Precision
        ignore_pretraining_limits:
          type: boolean
          title: Ignore Pretraining Limits
          default: true
        n_preprocessing_jobs:
          type: integer
          title: N Preprocessing Jobs
          default: 4
        fit_mode:
          $ref: '#/components/schemas/FitMode'
          default: fit_preprocessors
        device:
          anyOf:
            - items:
                type: string
              type: array
              minItems: 1
            - type: 'null'
          title: Device
          description: Stringified `torch.device`s
        memory_saving_mode:
          anyOf:
            - type: boolean
            - type: 'null'
          title: Memory Saving Mode
        model_path:
          anyOf:
            - type: string
            - type: 'null'
          title: Model Path
      additionalProperties: false
      type: object
      title: RegressorTabPFNConfig
    TableUsage:
      properties:
        num_rows:
          type: integer
          title: Num Rows
        num_cols:
          type: integer
          title: Num Cols
        num_cells:
          type: integer
          title: Num Cells
          readOnly: true
      additionalProperties: false
      type: object
      required:
        - num_rows
        - num_cols
        - num_cells
      title: TableUsage
      description: Shape of one request table as sent, before any preprocessing.
    ClassifierConfig:
      additionalProperties: false
      properties:
        task:
          const: classification
          default: classification
          title: Task
          type: string
        tabpfn_config:
          $ref: '#/components/schemas/ClassifierTabPFNConfig-Input'
        predict_params:
          $ref: '#/components/schemas/ClassifierPredictParams'
      title: ClassifierConfig
      type: object
    ClassifierOutputType:
      enum:
        - probas
        - preds
        - top_k
      title: ClassifierOutputType
      type: string
    ClassifierPredictParams:
      additionalProperties: false
      properties:
        output_type:
          $ref: '#/components/schemas/ClassifierOutputType'
          default: probas
          description:
            '`probas`: one probability per class per test row. `preds`: one label per test
            row. `top_k`: the k most probable classes per row, as positions plus probabilities.'
        top_k:
          anyOf:
            - minimum: 1
              type: integer
            - type: 'null'
          default: null
          title: Top K
          description: 'Required with `output_type: top_k`, rejected with any other output type.'
      title: ClassifierPredictParams
      type: object
    ClassifierTabPFNConfig-Input:
      additionalProperties: false
      properties:
        n_estimators:
          anyOf:
            - maximum: 8
              minimum: 1
              type: integer
            - type: 'null'
          default: null
          title: N Estimators
          description:
            'Ensemble size: forward passes per prediction. Omit to let the model decide (8
            for most data, more on very wide tables).'
        categorical_features_indices:
          anyOf:
            - items:
                type: integer
              type: array
            - type: 'null'
          default: null
          title: Categorical Features Indices
          description: Zero-based column positions to treat as categorical. Omit to infer.
        softmax_temperature:
          anyOf:
            - type: number
            - type: 'null'
          default: null
          title: Softmax Temperature
          description: Temperature applied to the output logits. Omit for the model default.
        average_before_softmax:
          anyOf:
            - type: boolean
            - type: 'null'
          default: null
          title: Average Before Softmax
          description: Average ensemble members before the softmax rather than after.
        random_state:
          anyOf:
            - type: integer
            - type: 'null'
          default: null
          title: Random State
          description: Seed for the ensemble's randomised preprocessing.
        inference_config:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          default: null
          description: Advanced overrides of the model's inference configuration, passed through as given.
          title: Inference Config
        inference_precision:
          anyOf:
            - enum:
                - autocast
                - auto
              type: string
            - type: 'null'
          default: null
          title: Inference Precision
          description: Numeric precision of the forward pass.
        ignore_pretraining_limits:
          default: true
          title: Ignore Pretraining Limits
          type: boolean
          description:
            'DISABLED in this container: sending a value other than the default is rejected
            with 422.'
        n_preprocessing_jobs:
          default: 4
          title: N Preprocessing Jobs
          type: integer
          description: CPU workers used for per-estimator preprocessing.
        fit_mode:
          $ref: '#/components/schemas/FitMode'
          default: fit_preprocessors
          description:
            '`fit_preprocessors` (default), `low_memory` and `batched` are served. `fit_with_cache`
            is rejected with 400: this container has no model cache.'
        device:
          anyOf:
            - items:
                type: string
              minItems: 1
              type: array
            - type: 'null'
          default: null
          description: 'DISABLED in this container: sending it is rejected with 422.'
          title: Device
        memory_saving_mode:
          anyOf:
            - type: boolean
            - type: 'null'
          default: null
          title: Memory Saving Mode
          description: 'Omit to let the container decide: off below 10,000 training rows, on from there.'
        model_path:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Model Path
          description:
            'DISABLED in this container: only `null`, `"auto"` or `"default"` are accepted;
            anything else is rejected with 422. Select a model with the top-level `model_version` instead.'
        balance_probabilities:
          anyOf:
            - type: boolean
            - type: 'null'
          default: null
          title: Balance Probabilities
          description: Re-weight class probabilities to counter class imbalance.
      title: ClassifierTabPFNConfig
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        message:
          title: Message
          type: string
        error_code:
          default: GENERAL_ERROR
          title: Error Code
          type: string
          x-sdk-keep-default: true
          description:
            '`USER_ERROR` for 4xx, `BUSY` for a 503 from the concurrency limit, `INTERNAL_ERROR`
            for 5xx.'
        trace_id:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          default: null
          title: Trace Id
          description: 32 hex characters identifying the request in the container's logs.
      required:
        - message
      title: ErrorResponse
      type: object
      description:
        'Body of every error the application raises. Unrouted paths and wrong methods (404,
        405) return `{"detail": "..."}` instead.'
    PredictRequestContext:
      additionalProperties: false
      properties:
        model_id:
          anyOf:
            - format: uuid
              type: string
            - type: 'null'
          default: null
          title: Model Id
      title: PredictRequestContext
      type: object
    RegressorConfig:
      additionalProperties: false
      properties:
        task:
          const: regression
          default: regression
          title: Task
          type: string
        tabpfn_config:
          $ref: '#/components/schemas/RegressorTabPFNConfig-Input'
        predict_params:
          $ref: '#/components/schemas/RegressorPredictParams'
      title: RegressorConfig
      type: object
    RegressorOutputType:
      enum:
        - mean
        - median
        - mode
        - quantiles
        - full
        - main
      title: RegressorOutputType
      type: string
    RegressorPredictParams:
      additionalProperties: false
      properties:
        output_type:
          $ref: '#/components/schemas/RegressorOutputType'
          default: mean
          description:
            '`mean`, `median`, `mode`: one number per test row. `quantiles`: one array per
            requested quantile. `main`: mean, median, mode and quantiles together. `full`: `main` plus
            the predicted distribution (`logits`, `borders`).'
        quantiles:
          anyOf:
            - items:
                maximum: 1.0
                minimum: 0.0
                type: number
              type: array
            - type: 'null'
          default: null
          title: Quantiles
          description:
            Quantile levels in [0, 1]. Read by `quantiles`, `main` and `full`; ignored by the
            point output types. Omit for 0.1 … 0.9.
      title: RegressorPredictParams
      type: object
    RegressorTabPFNConfig-Input:
      additionalProperties: false
      properties:
        n_estimators:
          anyOf:
            - maximum: 8
              minimum: 1
              type: integer
            - type: 'null'
          default: null
          title: N Estimators
          description:
            'Ensemble size: forward passes per prediction. Omit to let the model decide (8
            for most data, more on very wide tables).'
        categorical_features_indices:
          anyOf:
            - items:
                type: integer
              type: array
            - type: 'null'
          default: null
          title: Categorical Features Indices
          description: Zero-based column positions to treat as categorical. Omit to infer.
        softmax_temperature:
          anyOf:
            - type: number
            - type: 'null'
          default: null
          title: Softmax Temperature
          description: Temperature applied to the output logits. Omit for the model default.
        average_before_softmax:
          anyOf:
            - type: boolean
            - type: 'null'
          default: null
          title: Average Before Softmax
          description: Average ensemble members before the softmax rather than after.
        random_state:
          anyOf:
            - type: integer
            - type: 'null'
          default: null
          title: Random State
          description: Seed for the ensemble's randomised preprocessing.
        inference_config:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          default: null
          description: Advanced overrides of the model's inference configuration, passed through as given.
          title: Inference Config
        inference_precision:
          anyOf:
            - enum:
                - autocast
                - auto
              type: string
            - type: 'null'
          default: null
          title: Inference Precision
          description: Numeric precision of the forward pass.
        ignore_pretraining_limits:
          default: true
          title: Ignore Pretraining Limits
          type: boolean
          description:
            'DISABLED in this container: sending a value other than the default is rejected
            with 422.'
        n_preprocessing_jobs:
          default: 4
          title: N Preprocessing Jobs
          type: integer
          description: CPU workers used for per-estimator preprocessing.
        fit_mode:
          $ref: '#/components/schemas/FitMode'
          default: fit_preprocessors
          description:
            '`fit_preprocessors` (default), `low_memory` and `batched` are served. `fit_with_cache`
            is rejected with 400: this container has no model cache.'
        device:
          anyOf:
            - items:
                type: string
              minItems: 1
              type: array
            - type: 'null'
          default: null
          description: 'DISABLED in this container: sending it is rejected with 422.'
          title: Device
        memory_saving_mode:
          anyOf:
            - type: boolean
            - type: 'null'
          default: null
          title: Memory Saving Mode
          description: 'Omit to let the container decide: off below 10,000 training rows, on from there.'
        model_path:
          anyOf:
            - type: string
            - type: 'null'
          default: null
          title: Model Path
          description:
            'DISABLED in this container: only `null`, `"auto"` or `"default"` are accepted;
            anything else is rejected with 422. Select a model with the top-level `model_version` instead.'
      title: RegressorTabPFNConfig
      type: object
    Table:
      title: Table
      description:
        A feature table, at least one row. Row-oriented (list of equal-length rows; columns
        are then named by position) or column-oriented (object of column name → list of values). Cells
        are numbers, strings, booleans or null; null is a missing value. String columns are handled as
        categorical or free text by the preprocessing pipeline.
      oneOf:
        - title: Rows
          type: array
          minItems: 1
          items:
            type: array
            items: &id004
              type:
                - number
                - string
                - boolean
                - 'null'
        - title: Columns
          type: object
          minProperties: 1
          additionalProperties:
            type: array
            items: *id004
    Target:
      title: Target
      description:
        'The training target: exactly one column, one value per training row. A flat list,
        a list of one-element rows, or an object with a single column. Classification labels may be strings,
        integers, floats or booleans; regression targets must be numeric.'
      oneOf:
        - title: Flat
          type: array
          minItems: 1
          items: *id004
        - title: Rows
          type: array
          minItems: 1
          items:
            type: array
            minItems: 1
            maxItems: 1
            items: *id004
        - title: Column
          type: object
          minProperties: 1
          maxProperties: 1
          additionalProperties:
            type: array
            items: *id004
    PredictRequest:
      title: PredictRequest
      type: object
      additionalProperties: false
      required:
        - task_config
        - X_train
        - y_train
        - X_test
      properties:
        task_config: &id005
          oneOf:
            - $ref: '#/components/schemas/ClassifierConfig'
            - $ref: '#/components/schemas/RegressorConfig'
          discriminator:
            propertyName: task
            mapping:
              classification: '#/components/schemas/ClassifierConfig'
              regression: '#/components/schemas/RegressorConfig'
        model_version: &id006
          type: string
          enum:
            - v2
            - v2.5
            - v2.6
            - v3
            - v3.5
          description:
            Model family to fit with. This image serves v3, v3.5; any other listed value is
            rejected with 400. Omit for v3.5.
        tabpfn_systems: &id007
          type: array
          items:
            type: string
            enum:
              - preprocessing
              - text
              - thinking
          default:
            - preprocessing
            - text
          description:
            Preprocessing stages to run. `["preprocessing", "text"]` (default) is the full
            pipeline including text embeddings; `["preprocessing"]` skips text embeddings; `[]` hands
            the tables to the model as sent. Order is fixed and `"text"` needs `"preprocessing"`. `"thinking"`
            is rejected with 422.
        context: &id008
          $ref: '#/components/schemas/PredictRequestContext'
          description:
            Accepted for compatibility. A non-null `model_id` without training data is rejected
            with 400.
        X_train:
          $ref: '#/components/schemas/Table'
        y_train:
          $ref: '#/components/schemas/Target'
        X_test:
          $ref: '#/components/schemas/Table'
          description: Same number of columns as `X_train`, in the same order.
      description:
        '`x_train` and `x_test` are accepted as aliases of `X_train` and `X_test`. Unknown
        top-level keys are rejected with 422.'
    PredictRequestConfig:
      title: PredictRequestConfig
      type: object
      additionalProperties: false
      required:
        - task_config
      properties:
        task_config: *id005
        model_version: *id006
        tabpfn_systems: *id007
        context: *id008
      description: The JSON carried in the `request` part of a multipart upload.
    PredictMultipart:
      title: PredictMultipart
      type: object
      required:
        - request
        - x_train
        - y_train
        - x_test
      properties:
        request:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/PredictRequestConfig'
          description: A plain form field (not a file) holding a `PredictRequestConfig` as a JSON string.
        x_train:
          type: string
          format: binary
          description: CSV with a header row, or Parquet.
        y_train:
          type: string
          format: binary
          description: CSV with a header row, or Parquet. Exactly one column.
        x_test:
          type: string
          format: binary
          description: CSV with a header row, or Parquet.
    Prediction:
      title: Prediction
      description: Shape depends on the task and `output_type`. Non-finite numbers are serialised as null.
      anyOf:
        - title: ClassProbabilities
          description: 'Classification `probas`: `[row][class]`, columns ordered as `metadata.classes`.'
          type: array
          items: &id009
            type: array
            items: &id010
              type:
                - number
                - 'null'
        - title: ClassLabels
          description: "Classification `preds`: one label per test row, in the label's original type."
          type: array
          items:
            type:
              - string
              - number
              - boolean
        - title: TopK
          description: Classification `top_k`. Rows run most-probable-first and are never padded.
          type: object
          required:
            - classes
            - values
            - probabilities
          properties:
            classes:
              type: array
              items:
                type:
                  - string
                  - number
                  - boolean
              description: Class labels in ascending order.
            values:
              type: array
              items:
                type: array
                items:
                  type: integer
              description: '`[row][rank]` → position in `classes`.'
            probabilities:
              type: array
              items: *id009
              description: "`[row][rank]` → that class's probability."
        - title: PointEstimates
          description: 'Regression `mean`, `median`, `mode`: one number per test row.'
          type: array
          items: *id010
        - title: Quantiles
          description: 'Regression `quantiles`: `[quantile][row]`, quantiles in the order requested.'
          type: array
          items: *id009
        - title: RegressionBundle
          description: Regression `main` (first four keys) and `full` (all six).
          type: object
          required:
            - mean
            - median
            - mode
            - quantiles
          properties:
            mean: *id009
            median: *id009
            mode: *id009
            quantiles:
              type: array
              items: *id009
              description: '`[quantile][row]`.'
            logits:
              type: array
              items: *id009
              description: '`full` only. `[row][bucket]` over the predicted distribution.'
            borders:
              type: array
              items: *id010
              description: '`full` only. Bucket borders; one more than buckets.'
servers:
  - url: http://localhost:8080
    description: The container's port
tags:
  - name: inference
  - name: operations
