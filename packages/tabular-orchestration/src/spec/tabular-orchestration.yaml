  - url: https://api.ai.{region}.ml.hana.ondemand.com/v2/inference/deployments/{deployment_id}
    description: Production endpoint for SAP AI Core
    variables:
      region:
        enum:
          - prod.eu-central-1.aws
          - prod.us-east-1.aws
          - prod.ap-northeast-1.aws
          - prod.ap-southeast-2.aws
          - prod-ap11.ap-southeast-1.aws
          - prod-br10.sa-east-1.aws
          - prod-eu20.westeurope.azure
          - prod-us21.eastus.azure
          - prod-us20.westus2.azure
          - prod-ap20.australiaeast.azure
          - prod-ap21.southeastasia.azure
          - prod-eu30.europe-west3.gcp
          - prod-us30.us-central1.gcp
          - prod-ap30.australia-southeast1.gcp
          - prod-in30.asia-south1.gcp
          - prod-eu01.eu-de-1.sapcc
        default: prod.eu-central-1.aws
      deployment_id:
        description:
          The deployment ID of the Tabular AI Orchestration service. To be
          obtained from the SAP AI Core service using the deployments endpoint.
        default: d1234567890
