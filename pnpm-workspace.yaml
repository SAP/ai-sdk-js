packages:
  - packages/ai-api
  - packages/core
  - packages/document-grounding
  - packages/foundation-models
  - packages/openai
  - packages/langchain
  - packages/orchestration
  - packages/llm-batch
  - packages/prompt-registry
  - packages/rpt
  - sample-cap
  - sample-code
  - tests/e2e-tests
  - tests/smoke-tests
  - tests/type-tests

allowBuilds:
  '@swc/core': true
  better-sqlite3: false
  esbuild: false
  unrs-resolver: false

blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - '@sap-ai-sdk/*'
  - '@sap-cloud-sdk/*'
  - brace-expansion@1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 5.0.9
  - js-yaml@4.3.0 || 5.2.2
  - '@hono/node-server@2.0.5 || 2.0.12'
  - fast-uri@3.1.5
  - ip-address@10.2.1 || 10.2.2 || 10.3.1
  - hono@4.12.34
  - '@modelcontextprotocol/sdk@1.24.0'
  - postcss@8.5.23
  - undici@6.28.0
  # Add minimum age exceptions for audit issues here
  # - sample-package@0.1.0
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'picomatch@4.0.5'
trustPolicyIgnoreAfter: 131400 # 3 months
