packages:
  - packages/ai-api
  - packages/context-registry
  - packages/core
  - packages/document-grounding
  - packages/foundation-models
  - packages/langchain
  - packages/llm-batch
  - packages/openai
  - packages/orchestration
  - packages/prompt-registry
  - packages/rpt
  - packages/tabular-orchestration
  - sample-cap
  - sample-code
  - tests/e2e-tests
  - tests/smoke-tests
  - tests/type-tests
  - .github/actions/check-pr
  - .github/actions/check-public-api
  - .github/actions/get-changelog
  - .github/actions/changesets-fixed-version-bump

allowBuilds:
  '@swc/core': true
  better-sqlite3: false
  esbuild: false
  unrs-resolver: false

permissions:
  dotenv:
    skills: false

# Fix/investigate: does not work as expected because checkout action uses detached HEAD
# gitBranchLockfile: true
# mergeGitBranchLockfilesBranchPattern:
#   - main
#   - renovate/*

catalog:
  '@langchain/core': ^1.2.13
  '@langchain/langgraph': ^1.4.18
  '@sap-cloud-sdk/connectivity': ^4.10.0
  '@sap-cloud-sdk/generator-common': ^4.10.0
  '@sap-cloud-sdk/http-client': ^4.10.0
  '@sap-cloud-sdk/openapi': ^4.10.0
  '@sap-cloud-sdk/openapi-generator': ^4.10.0
  '@sap-cloud-sdk/resilience': ^4.10.0
  '@sap-cloud-sdk/util': ^4.10.0
  langchain: ^1.5.14
  zod: ^4.6.6

blockExoticSubdeps: true
minimumReleaseAge: 5760
minimumReleaseAgeExclude:
  - '@sap-ai-sdk/*'
  - body-parser@2.4.0
  # Add minimum age exceptions for audit issues here
  # - sample-package@0.1.0
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'picomatch@4.0.5'
  - 'undici-types@6.21.0'
trustPolicyIgnoreAfter: 131400 # 3 months

# deuplicate dep resolution where possible
autoDedupe: true
dedupeInjectedDeps: true
dedupePeerDependents: true
lockfile:
  includeResolutionSettings: true
