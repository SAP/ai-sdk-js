# For trusted publishing releases, it is required to start all releases from a single workflow file.
# This workflow delegates to the appropriate release workflow based on the event that triggered it.
name: publish

on:
  # Triggers for canary releases
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dist tag for the release. If you chose something different than "canary", make sure to delete it once it is not needed anymore.'
        type: string
        required: false
        default: 'canary'
  # Triggers for official releases
  release:
    types: [published] # Trigger when a GitHub Release is published

permissions: {}

jobs:
  check-skip-canary:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check for weekend or Brandenburg public holiday
        id: check
        shell: bash
        run: |
          # Compute Easter Sunday for a given year using the Anonymous Gregorian algorithm
          easter() {
            local y=$1
            local a=$((y % 19))
            local b=$((y / 100))
            local c=$((y % 100))
            local d=$((b / 4))
            local e=$((b % 4))
            local f=$(((b + 8) / 25))
            local g=$(((b - f + 1) / 3))
            local h=$(((19 * a + b - d - g + 15) % 30))
            local i=$((c / 4))
            local k=$((c % 4))
            local l=$(((32 + 2 * e + 2 * i - h - k) % 7))
            local m=$(((a + 11 * h + 22 * l) / 451))
            local month=$(((h + l - 7 * m + 114) / 31))
            local day=$(((h + l - 7 * m + 114) % 31 + 1))
            printf "%04d-%02d-%02d" "$y" "$month" "$day"
          }

          today=$(date -u +%Y-%m-%d)
          dow=$(date -u +%u)  # 1=Mon … 7=Sun

          # Skip on weekends
          if [ "$dow" -ge 6 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: weekend ($today)"
            exit 0
          fi

          year=$(date -u +%Y)
          easter_date=$(easter "$year")
          easter_ts=$(date -d "$easter_date" +%s)

          # Compute movable holidays relative to Easter
          good_friday=$(date -d "@$((easter_ts - 2 * 86400))" +%Y-%m-%d)
          easter_monday=$(date -d "@$((easter_ts + 86400))" +%Y-%m-%d)
          ascension=$(date -d "@$((easter_ts + 39 * 86400))" +%Y-%m-%d)
          whit_monday=$(date -d "@$((easter_ts + 50 * 86400))" +%Y-%m-%d)
          corpus_christi=$(date -d "@$((easter_ts + 60 * 86400))" +%Y-%m-%d)

          # Fixed Brandenburg public holidays
          fixed_holidays=(
            "$year-01-01"  # New Year's Day
            "$year-05-01"  # Labour Day
            "$year-10-03"  # German Unity Day
            "$year-10-31"  # Reformation Day (Brandenburg)
            "$year-12-25"  # Christmas Day
            "$year-12-26"  # Boxing Day
          )

          all_holidays=(
            "${fixed_holidays[@]}"
            "$good_friday"
            "$easter_monday"
            "$ascension"
            "$whit_monday"
            "$corpus_christi"
          )

          for holiday in "${all_holidays[@]}"; do
            if [ "$today" = "$holiday" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping: Brandenburg public holiday ($today)"
              exit 0
            fi
          done

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Proceeding with canary release ($today)"

  delegate_to_release_job:
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    secrets:
      SAP_AI_SDK_BOT_CLIENT_ID: ${{ secrets.SAP_AI_SDK_BOT_CLIENT_ID }}
      SAP_AI_SDK_BOT_PRIVATE_KEY: ${{ secrets.SAP_AI_SDK_BOT_PRIVATE_KEY }}

  delegate_to_canary_job:
    needs: check-skip-canary
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && needs.check-skip-canary.outputs.skip == 'false') }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-canary.yml
    with:
      tag: ${{ inputs.tag || 'canary' }}
