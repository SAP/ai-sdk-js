name: smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: 0 2 * * *

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - name: Update smoke test dependencies
        # Always use latest SDK packages for smoke tests to ensure they are tested against the latest version.
        run: pnpm --filter @sap-ai-sdk/smoke-tests update '@sap-ai-sdk/*' --no-save --ignore-scripts
      - name: smoke test
        env:
          AICORE_SERVICE_KEY: ${{ secrets.AI_CORE_PRODUCTION }}
        run: pnpm test:smoke
      - name: 'Slack Notification'
        if: failure() && github.event_name == 'schedule'
        uses: slackapi/slack-github-action@0bc3581177d9a0f8d555e07689384b376528e8fa # v4.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "username": "GitHub E2E Test Runner",
              "text": "⚠️ Smoke Test for v2 Failed 🚭! Please inspect & fix by clicking <https://github.com/SAP/ai-sdk-js/actions/runs/${{ github.run_id }}|here>"
            }
