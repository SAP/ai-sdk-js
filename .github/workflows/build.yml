name: build

on:
  push:
    branches: ['main']
  pull_request: ~
  workflow_dispatch: ~

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for SonarQube OIDC authentication.

    strategy:
      fail-fast: false
      matrix:
        node-version: [26, 24, 22]

    env:
      # Only scan the first matrix job; skip fork and bot PRs.
      RUN_SONAR: >-
        ${{ strategy.job-index == 0 && github.event.pull_request.user.type != 'Bot' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      # type-check can run in parallel to unit tests
      - name: Type Tests
        id: test-type
        run: pnpm test:type
        background: true
      - run: pnpm test:unit $COVERAGE_FLAG
        env:
          COVERAGE_FLAG: ${{ case(strategy.job-index == 0, '--coverage', '') }}
      - name: Fetch main for SonarQube blame
        if: ${{ env.RUN_SONAR == 'true' }}
        run: git fetch --unshallow origin main
      - name: Authenticate to SonarQube
        id: sonar-auth
        if: ${{ env.RUN_SONAR == 'true' }}
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        with:
          project-key: SAP_ai-sdk-js
          export-env: 'false'
      - name: SonarQube Scan
        if: ${{ steps.sonar-auth.outcome == 'success' }}
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
      - name: Wait for type tests
        wait: test-type

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - name: Enforce generated code is up to date
        run: |
          pnpm generate
          pnpm apply-patches
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Generated code is out of date. The following changes were found after generating:"
            git status
            echo "Please run 'pnpm generate' and 'pnpm apply-patches' and commit the changes."
            exit 1
          fi
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
        background: true
      - name: Lint codebase
        id: lint
        run: pnpm lint
        background: true
      - name: Set NODE_PATH
        run: echo "NODE_PATH=$(pwd)/node_modules" >> "$GITHUB_ENV"
      # Independent read-only checks — run them concurrently.
      - parallel:
          - name: Check public API
            uses: ./.github/actions/check-public-api # zizmor: ignore[self-repository]
            with:
              force_internal_exports: 'false'
              ignored_path_pattern: '.*?/client/.*?/schema|.*?/zod/.*?'
          - name: Check dependencies
            run: pnpm check:deps --reporter=github-actions
          - name: License Check
            uses: ./.github/actions/check-license # zizmor: ignore[self-repository]
          - name: API Doc Check
            run: pnpm doc
      - wait-all:
