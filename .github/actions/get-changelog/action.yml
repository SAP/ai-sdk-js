name: 'Get current changelog'
description: 'Gets the current changelog'
outputs:
  changelog:
    description: 'The current changelog'
    value: ${{ steps.run.outputs.changelog }}
runs:
  using: 'composite'
  steps:
    - name: Run get-changelog
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}/build-packages/get-changelog
      run: node index.ts
