name: 'Check PR'
description: 'Checks the current PR for semantical correctness and appropriate changelog.'
inputs:
  changed-files:
    description: 'Changed files in the .changeset directory on the current PR.'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Run check-pr
      shell: bash
      working-directory: ${{ github.workspace }}/build-packages/check-pr
      env:
        INPUT_CHANGED-FILES: ${{ inputs.changed-files }}
      run: node index.ts
